services:
  nginx:
    build:
      context: ./
      dockerfile: docker/nginx.docker
    volumes:
      - ./:/var/www
      - ./docker/nginx/ssl:/etc/nginx/ssl
    ports:
      - "8080:443"
    links:
      - php-fpm
  php-fpm:
    build:
      context: ./
      dockerfile: docker/php-fpm.docker
    volumes:
      - ./:/var/www
    links:
      - mysql
    environment:
      DB_PORT: 3306
      DB_HOST: mysql
  mysql:
    image: mysql:8.0
    volumes:
      - ./storage/docker/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: dev_db_user
      MYSQL_PASSWORD: secret
      MYSQL_DATABASE: lara_board
    ports:
      - "33061:3306"
  node_a:
    image: node:24.11-alpine
    volumes:
      - ./:/var/www
    working_dir: /var/www
    tty: true
